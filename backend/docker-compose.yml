services:
  db:
    image: postgres:15
    container_name: dms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: disaster_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disaster_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    container_name: dms-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: disaster_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_super_secret}
      JWT_EXPIRY_MINUTES: 1440
      OSRM_URL: https://router.project-osrm.org/route/v1/driving
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
